services:
  frontend-service:
    build:
      context: ../geoszabaduloszoba-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - shared_network

  backend-service:
      build:
        context: ../geoszabaduloszoba-backend
        dockerfile: Dockerfile
      ports:
        - "8080:8080"
      depends_on:
        - minio
        - keycloak
        - pg-db
      networks:
        - shared_network

  ###   MINIO STORAGE   ####
  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: cityscape-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio_data:/data
    restart: always
    command: server /data --console-address ":9001"
    networks:
      - shared_network
      
  ###   KEYCLOAK   ####
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: ${ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      - keycloak-db
    networks:
      - shared_network

  ###   POSTGRES   ####
  keycloak-db:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    ports:
      - "5435:5432"
    networks:
      - shared_network


 ###   POSTGRES   ####
  pg-db:
    image: postgres:${POSTGRES_VERSION}
    volumes:
      - ./postgres_data_2:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: cityscape_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: geolokacios_jelszo
    restart: always
    ports:
      - "5432:5432"
    networks:
      - shared_network
      
      
networks:
  shared_network:
  


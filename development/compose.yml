version: '3.8'

services:
  frontend-service:
    build:
      context: ../geoszabaduloszoba-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - shared_network

  backend-service:
    build:
      context: ../geoszabaduloszoba-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg-db:5432/cityscape_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${CITYSCAPE_DB_PASSWORD}
    depends_on:
      minio:
        condition: service_started
      keycloak:
        condition: service_started
      pg-db:
        condition: service_healthy
    networks:
      - shared_network

  ###   MINIO STORAGE   ####
  minio:
    image: quay.io/minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: cityscape-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /srv/cityscape/minio_data:/data
    restart: always
    command: server /data --console-address ":9001"
    networks:
      - shared_network

  ###   KEYCLOAK   ####
  keycloak:
    build:
      context: ../cityscape-keycloak-theme
      dockerfile: Dockerfile
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.5.3}
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      - keycloak-db
    networks:
      - shared_network

  ###   KEYCLOAK_DB   ####
  keycloak-db:
    image: postgres:16-alpine
    volumes:
      - /srv/cityscape/keycloak_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    networks:
      - shared_network


  ###   POSTGRES   ####
  pg-db:
    image: postgres:18-alpine
    volumes:
      - cityscape_pg18_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: cityscape_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CITYSCAPE_DB_PASSWORD}
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cityscape_db" ]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - shared_network

networks:
  shared_network:

volumes:
  cityscape_pg18_data:
    external: true